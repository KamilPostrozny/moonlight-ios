name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The runner still defaults to Xcode 16 (iOS 18 SDK). Without the iOS 26 SDK,
      # iOS runs us in compatibility mode on iPhone Air / 17, reporting the previous
      # model's screen size (402x874 pt instead of 420x912) and upscaling everything.
      - name: Use the iOS 26 SDK
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Show toolchain
        run: xcodebuild -version

      # Signing is left to the sideloading tool (Sideloadly, AltStore, ...),
      # which re-signs the whole bundle with its own certificate anyway.
      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Moonlight.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            archive

      # Packed by hand rather than with -exportArchive, which insists on signing.
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Moonlight.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry Moonlight-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-ipa
          path: build/Moonlight-unsigned.ipa
          if-no-files-found: error
