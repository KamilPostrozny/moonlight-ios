name: Build IPA

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: xcodebuild -version

      # Signing is left to the sideloading tool (Sideloadly, AltStore, ...),
      # which re-signs the whole bundle with its own certificate anyway.
      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Moonlight.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            archive

      # Packed by hand rather than with -exportArchive, which insists on signing.
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Moonlight.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qry Moonlight-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-ipa
          path: build/Moonlight-unsigned.ipa
          if-no-files-found: error
